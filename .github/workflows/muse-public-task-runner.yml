name: GEM Muse public task model worker
on:
  push:
    branches:
      - muse/coding-agent-draft-pr-pilot-20261113
    paths:
      - '.github/muse-public-tasks/*.json'
permissions:
  contents: read
jobs:
  model-and-tests:
    if: github.repository == 'gem-cybersecurity-monitoring-assist/btcc-copy-manager'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Validate exactly one new public task request
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .muse-task
          node --input-type=module <<'NODE'
          import {readFile,writeFile} from 'node:fs/promises';
          import {validateMusePublicTask} from './scripts/muse-public-task-guard.mjs';
          const response=await fetch('https://api.github.com/repos/gem-cybersecurity-monitoring-assist/btcc-copy-manager/commits/'+process.env.GITHUB_SHA,{
            headers:{'Authorization':'Bearer '+process.env.GH_TOKEN,'User-Agent':'gem-muse-verified-task','Accept':'application/vnd.github+json'}
          });
          if(!response.ok)throw Error('github_commit_read_failed_'+response.status);
          const commit=await response.json();
          if(commit.sha!==process.env.GITHUB_SHA||!Array.isArray(commit.files))throw Error('commit_file_list_missing');
          const changed=commit.files.map(f=>f.filename);
          console.log('Request commit changed paths:',JSON.stringify(changed));
          if(changed.length!==1||!/^\.github\/muse-public-tasks\/[a-f0-9-]+\.json$/.test(changed[0]))throw Error('unexpected_commit_content');
          const raw=await readFile(changed[0],'utf8');
          if(raw.length>1000)throw Error('oversized_task_file');
          const task=validateMusePublicTask(JSON.parse(raw));
          if(changed[0]!=='.github/muse-public-tasks/'+task.id+'.json')throw Error('task_filename_mismatch');
          await writeFile('.muse-task/request.json',raw,{mode:0o600});
          console.log('Validated public task',task.id,'for allowlisted repository.');
          NODE
      - name: Check model-output and task validators
        run: node --test tests/muse-model-code-guard.test.mjs tests/muse-public-task-guard.test.mjs
      - name: Download integrity-pinned local model runtime
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 2 --max-time 100 'https://github.com/ggml-org/llama.cpp/releases/download/b12248/llama-b12248-bin-ubuntu-x64.tar.gz' -o .muse-task/runtime.tar.gz
          echo '6b3a530b44f6b0a4ae4872d3b3c8d1edc2ac6bba7d8bd211329a4ba644c0dc65  .muse-task/runtime.tar.gz' | sha256sum --check --status
          tar -xzf .muse-task/runtime.tar.gz -C .muse-task
      - name: Download public 0.5B open-weight coding model
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 2 --max-time 180 'https://huggingface.co/bartowski/Qwen2.5-Coder-0.5B-Instruct-GGUF/resolve/main/Qwen2.5-Coder-0.5B-Instruct-Q4_K_M.gguf?download=true' -o .muse-task/model.gguf
          size=$(stat -c%s .muse-task/model.gguf)
          test "$size" -gt 300000000 && test "$size" -lt 600000000
          head -c 4 .muse-task/model.gguf | grep -q GGUF
          echo '0128e77564e43d40682f82d7ebe8a9abdf0c24c8f55fa85629f8cc156b1b6560  .muse-task/model.gguf' | sha256sum --check --status
      - name: Generate and strictly test source from requested public task
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import {readFile,writeFile} from 'node:fs/promises';
          import {spawnSync} from 'node:child_process';
          import {readdir} from 'node:fs/promises';
          import {join} from 'node:path';
          import {validateMusePublicTask} from './scripts/muse-public-task-guard.mjs';
          import {validateMuseModelOutput} from './scripts/muse-model-code-guard.mjs';
          const task=validateMusePublicTask(JSON.parse(await readFile('.muse-task/request.json','utf8')));
          async function locate(dir) {
            for(const item of await readdir(dir,{withFileTypes:true})) {
              const p=join(dir,item.name);
              if(item.isDirectory()) { const q=await locate(p);if(q)return q; }
              if(item.isFile()&&item.name==='llama-cli')return p;
            }
          }
          const cli=await locate('.muse-task');
          if(!cli)throw Error('inference_runtime_missing');
          const prompt = task.kind==='clamp_function'
            ? 'Write exactly one JavaScript function declaration named clamp(value,min,max), with body: return Math.min(Math.max(value,min),max); No additional code or prose. User task: '+task.instruction
            : 'Write only a JavaScript function declaration named add that accepts a and b and returns their arithmetic sum. User task: '+task.instruction+' No markdown, no imports, no explanation.';
          const proc=spawnSync(cli,['-m','.muse-task/model.gguf','-p',prompt,'-n','90','-c','1024','--temp','0','--no-display-prompt'],{
            encoding:'utf8',timeout:110000,maxBuffer:100000,
            env:{PATH:process.env.PATH||'/usr/bin:/bin',LD_LIBRARY_PATH:join(process.cwd(),cli.slice(0,cli.lastIndexOf('/')))}
          });
          if(proc.status!==0)throw Error('model_execution_failed');
          const result=validateMuseModelOutput(proc.stdout,{kind:task.kind});
          if(!result.verified||!result.modelUsed||result.generalSandbox)throw Error('model_code_not_approved');
          await writeFile('.muse-task/verified.mjs',result.source,{mode:0o600});
          await writeFile('.muse-task/sha256.txt',result.sha256+'\n',{mode:0o600});
          console.log('Independent model code validated:',task.id,result.sha256,'source:',JSON.stringify(result.source));
          NODE
      - name: Execute allowlisted generated code inside network-disabled read-only Docker container
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/muse-container-proof.test.mjs
          node scripts/muse-container-proof.mjs
      - name: Deliver only validated result to publisher
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: verified-muse-public-task
          retention-days: 3
          path: |
            .muse-task/request.json
            .muse-task/verified.mjs
            .muse-task/sha256.txt
  publish-review-branch:
    needs: model-and-tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: verified-muse-public-task
          path: .muse-task
      - name: Recheck public task, model source and exact SHA-256
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import {readFile,writeFile} from 'node:fs/promises';
          import {validateMusePublicTask} from './scripts/muse-public-task-guard.mjs';
          import {validateMuseModelOutput} from './scripts/muse-model-code-guard.mjs';
          const task=validateMusePublicTask(JSON.parse(await readFile('.muse-task/request.json','utf8')));
          const source=await readFile('.muse-task/verified.mjs','utf8');
          const sha=(await readFile('.muse-task/sha256.txt','utf8')).trim();
          const result=validateMuseModelOutput(source,{kind:task.kind});
          if(!result.verified||result.sha256!==sha||result.source!==source)throw Error('artifact_integrity_failure');
          await writeFile('.muse-task/branch.txt',task.branch+'\n',{mode:0o600});
          await writeFile('.muse-task/path.txt',task.path+'\n',{mode:0o600});
          console.log('Validated AI task for safe branch:',task.id,sha);
          NODE
      - name: Commit the checked code only to its own review branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_PROMPT_DISABLED: '1'
        run: |
          set -euo pipefail
          repo='gem-cybersecurity-monitoring-assist/btcc-copy-manager'
          branch="$(cat .muse-task/branch.txt)"
          path="$(cat .muse-task/path.txt)"
          if gh api "repos/$repo/git/ref/heads/$branch" >/dev/null 2>&1; then
            echo "Review branch exists; no overwrite or duplicate."
            exit 0
          fi
          base="$(gh api "repos/$repo/branches/main" --jq '.commit.sha')"
          [[ "$base" =~ ^[a-f0-9]{40}$ ]]
          gh api "repos/$repo/git/refs" -X POST -f ref="refs/heads/$branch" -f sha="$base" >/dev/null
          content="$(base64 -w 0 .muse-task/verified.mjs)"
          gh api "repos/$repo/contents/$path" -X PUT -f message='muse: requested open-weight AI code passed strict validation' -f content="$content" -f branch="$branch" >/dev/null
          echo "Model-generated reviewed branch ready: $branch"
          echo "Draft PR requires owner-authorized connector; GitHub Actions PR creation remains disabled."
