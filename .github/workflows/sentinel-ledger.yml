name: Sentinel ledger PostgreSQL validation
on:
  pull_request:
    paths:
      - "supabase/migrations/**"
      - "supabase/tests/**"
      - "sentinel/observation_repository.py"
      - "sentinel/tests/test_observation_repository.py"
      - "scripts/test-sentinel-ledger.sh"
      - ".github/workflows/sentinel-ledger.yml"
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - "supabase/tests/**"
      - "sentinel/observation_repository.py"
      - "sentinel/tests/test_observation_repository.py"
      - "scripts/test-sentinel-ledger.sh"
      - ".github/workflows/sentinel-ledger.yml"
permissions:
  contents: read
jobs:
  postgres-ledger:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Apply twice and validate owner isolation in disposable PostgreSQL
        run: bash scripts/test-sentinel-ledger.sh
