[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "btcc-sentinel"
version = "0.3.1"
description = "Local BTCC trader monitor, deterministic risk governor, workflow preparation service"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.8",
  "fastapi>=0.115",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
ai = ["openai-agents>=0.2.0"]
dev = ["pytest>=8.0"]

[tool.setuptools]
py-modules = ["models", "risk", "monitor", "autonomy", "workflow", "storage", "service", "main"]

[tool.pytest.ini_options]
pythonpath = ["."]
